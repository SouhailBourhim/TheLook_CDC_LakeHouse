# Loaded by every Spark process in this image (master, worker, drivers).

# Iceberg's SQL extensions: MERGE INTO, UPDATE, DELETE, CALL procedures.
spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalog "lake" = the AWS Glue Data Catalog, with Iceberg tables whose
# files are read and written by Iceberg's own S3 client (S3FileIO, AWS SDK
# v2). Tables are addressed as lake.<glue database>.<table>, for example
# lake.thelook_bronze.users. The warehouse (s3://<lake bucket>/) contains
# the account id, so it is passed per job, not committed.
spark.sql.catalog.lake                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type              glue
spark.sql.catalog.lake.io-impl           org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.client.region     us-east-1

# Timestamps are kept in UTC end to end (the sources are UTC, spec 4.1).
spark.sql.session.timeZone               UTC

# Secrets in the UI and logs: Spark's default redaction regex already hides
# keys matching secret|password|token|access[.]key; AWS_SECRET_ACCESS_KEY
# matches "secret".
