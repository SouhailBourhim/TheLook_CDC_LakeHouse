# Kafka Connect worker, distributed mode (one worker locally).
#
# Distributed mode keeps connector configs, source offsets and task status
# in Kafka topics instead of local files. Any worker with the same group.id
# joins the cluster and can take over tasks; the container itself is
# stateless. Exactly-once source support only exists in this mode.

bootstrap.servers=kafka:29092
group.id=thelook-connect

# REST API (connectors are registered through it in commit 11).
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect

# --- Internal topics ---------------------------------------------------------
# Created by the worker on first start, compacted, replication factor 1
# (single broker; 3 in production).
config.storage.topic=_connect-configs
offset.storage.topic=_connect-offsets
status.storage.topic=_connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

# --- Exactly-once source (KIP-618) -------------------------------------------
# Each source task writes its records and its source offsets (for Debezium:
# the LSN) in one Kafka transaction, so a crash cannot leave records written
# without their offset, which would replay them as duplicates. Needs the
# transaction log, hence transaction.state.log.* in kafka/server.properties.
# Connectors opt in with exactly.once.support=required (commit 11).
exactly.once.source.support=enabled

# --- Converters --------------------------------------------------------------
# Default for every connector on this worker: Avro keys and values, schemas
# in the registry. Connectors may override.
key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# --- Plugins -----------------------------------------------------------------
plugin.path=/opt/connect-plugins
