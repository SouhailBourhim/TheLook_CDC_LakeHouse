# Kafka 4 broker configuration (single node, KRaft).
#
# Mounted at /mnt/shared/config/server.properties. The apache/kafka image
# then uses this file instead of its defaults (KAFKA_* environment
# variables would still override it; we set none). Per-topic settings
# changed later with kafka-configs.sh override this file for that topic.

# --- KRaft: one process is both broker and controller -----------------------
# No ZooKeeper since Kafka 4.0: cluster metadata lives in an internal Raft
# log (__cluster_metadata) managed by the controller.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER

# --- Listeners ---------------------------------------------------------------
# A client connects to any bootstrap address, then receives the broker's
# ADVERTISED address and reconnects to it. So every client network needs
# its own listener advertising an address that is reachable from there:
#   INTERNAL  kafka:29092     for containers on the Compose network
#   EXTERNAL  localhost:9092  for tools on the host (published on 127.0.0.1)
#   CONTROLLER :9093          KRaft quorum traffic, never published
listeners=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
advertised.listeners=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL

# --- Storage -----------------------------------------------------------------
# The image's default is /tmp/kraft-combined-logs, outside the volume:
# all data would be lost whenever the container is recreated.
log.dirs=/var/lib/kafka/data

# --- Single broker: internal topics cannot have 3 replicas -------------------
# Defaults are 3; with one broker, creating these topics would fail and,
# for the transaction log, exactly-once producers (Kafka Connect with
# exactly.once.source.support) would never start. A production cluster
# uses 3 (documented in the spec, NFR Kafka configuration).
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
default.replication.factor=1
num.partitions=1

# Topics are created on purpose (by Connect, Schema Registry or scripts),
# never implicitly by a client that reads or writes a mistyped name.
auto.create.topics.enable=false

# --- Retention (personal data lives in these topics) -------------------------
# 3 days: enough to replay a full day (NFR), short enough for "a few days"
# of personal data (spec 7). Retention deletes whole closed segments only,
# and a segment closes at 1 GB or after log.roll.hours (default 7 days).
# At our volume segments never reach 1 GB, so without a daily roll data
# would stay 7+ days whatever the retention says. Worst case now: ~4 days.
log.retention.hours=72
log.roll.hours=24
