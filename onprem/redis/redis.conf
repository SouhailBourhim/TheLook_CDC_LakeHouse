# Redis for the online user features (ADR 018). A cache rebuilt from the
# events stream, but it must survive a restart together with the features
# stream's checkpoint: an empty Redis behind a checkpoint that has moved on
# would stay silently empty until new events arrived.

# Listen on every interface of the container; the host publishes the port
# on 127.0.0.1 only (compose.yaml). Protected mode stays on: it only blocks
# outside clients when the default user needs no password, and ours is
# disabled (start-redis.sh).
bind * -::*
port 6379
protected-mode yes
dir /data

# Persistence: the append-only file logs every write, fsynced once a second
# (a hard crash loses at most ~1 s; the runbook's rebuild repairs it).
# "always" would fsync every write; "no" leaves it to the kernel (~30 s).
appendonly yes
appendfsync everysec
# No RDB snapshots on top: the AOF already holds everything, and each
# snapshot forks the process and writes the whole dataset again. AOF
# rewrites still start from an RDB image (aof-use-rdb-preamble, default).
save ""

# Memory cap. Every key has a TTL (ADR 018), so under pressure evict the
# keys closest to expiring first. 256 MB is far above the measured need
# (step 5); the container limit leaves room for the fork of an AOF rewrite.
maxmemory 256mb
maxmemory-policy volatile-ttl
