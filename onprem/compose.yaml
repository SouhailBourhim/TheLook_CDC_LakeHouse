# On-prem side of the pipeline. Services are grouped in profiles so only
# what is needed runs:  docker compose --profile core up -d
name: thelook

services:
  postgres:
    # Exact minor version plus digest: the tag says what it is, the digest
    # guarantees the same bytes on every machine even if the tag is re-pushed.
    image: postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thelook}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in onprem/.env}
      # Read by postgres/initdb/10-generator.sh to create the generator role.
      GENERATOR_DB_PASSWORD: ${GENERATOR_DB_PASSWORD:?set GENERATOR_DB_PASSWORD in onprem/.env}
    # All settings live in postgres/postgresql.conf. Only the file's location
    # is passed here: -c flags would override ALTER SYSTEM (see that file).
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      # Localhost only: reachable from WSL and Windows, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, not the Unix socket: during first-start initialisation the
      # entrypoint runs a temporary server that listens on the socket only,
      # so a socket check would report healthy before clients can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # The image stops Postgres with SIGINT (fast shutdown). Give it time to
    # finish before Docker sends SIGKILL, which would force crash recovery.
    stop_grace_period: 30s

  generator:
    # Vendored theLook generator (onprem/generator, see its NOTICE).
    build: ./generator
    image: thelook-generator:local
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      # Clickstream events go to MongoDB (ADR 008): wait until it accepts
      # writes and its users exist. service_completed_successfully also makes
      # `up --wait` fail when mongo/setup.js fails.
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      # Timestamps are TIMESTAMP WITHOUT TIME ZONE filled with datetime.now():
      # the container's clock zone becomes the data's zone.
      TZ: UTC
      # Read by our patch in generator.py, so the password is neither on the
      # command line nor in the logs. It is still visible in `docker inspect`;
      # acceptable on a laptop (Compose secrets would hide it).
      DB_PASSWORD: ${GENERATOR_DB_PASSWORD:?set GENERATOR_DB_PASSWORD in onprem/.env}
      MONGO_PASSWORD: ${MONGO_GENERATOR_PASSWORD:?set MONGO_GENERATOR_PASSWORD in onprem/.env}
    # Every value is explicit, even when it equals the generator's default,
    # so the workload is visible here and does not change with upstream.
    command:
      - --db-host=postgres
      - --db-name=${POSTGRES_DB:-thelook}
      - --db-schema=shop
      - --db-user=generator
      - --avg-qps=${GENERATOR_QPS:-5}
      - --init-num-users=1000
      - --user-create-prob=0.05
      - --user-update-prob=0.1
      - --order-update-prob=0.4
      - --ghost-create-prob=0.2
      # Synthetic (spec 4.3): later items of an order come from the first
      # item's category 60 % of the time, so co-purchase pairs repeat.
      - --basket-affinity-prob=0.6
      - --mongo-host=mongo
      - --mongo-db=web
      - --mongo-user=generator

  review-simulator:
    # Synthetic reviews in MongoDB web.reviews for delivered order items
    # (spec 4.3, ADR 008): inserts, helpful votes, edits and a few deletes.
    build: ./review-simulator
    image: thelook-review-simulator:local
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      # Read-only Postgres role from postgres/reviewer-setup.sql (applied with
      # apply-sql.sh); until it exists the simulator logs errors and retries.
      PG_PASSWORD: ${REVIEWER_DB_PASSWORD:?set REVIEWER_DB_PASSWORD in onprem/.env}
      MONGO_PASSWORD: ${MONGO_REVIEWER_PASSWORD:?set MONGO_REVIEWER_PASSWORD in onprem/.env}
    command:
      # One action per second on average: ~2,200 new reviews an hour.
      - --rate=1
      - --pg-host=postgres
      - --pg-db=${POSTGRES_DB:-thelook}
      - --mongo-host=mongo

  mongo:
    # 8.0 is MongoDB's current major release line (longest support) and is in
    # Debezium 3.x's tested range; 8.1+ are short-lived minor releases.
    image: mongo:8.0.32@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
    profiles: [core]
    hostname: mongo
    # start-mongod.sh creates the keyfile, then runs the image's entrypoint.
    entrypoint: ["/bin/bash", "/etc/mongo/start-mongod.sh"]
    command:
      - mongod
      # Replica set: Debezium reads change streams, which a standalone lacks.
      - --replSet=rs0
      # Members authenticate to each other with this shared secret; it also
      # turns on access control (no user can connect without a password).
      - --keyFile=/data/configdb/keyfile
      # WiredTiger's default cache is 50 % of (RAM - 1 GB) of the *host*,
      # ~7 GB here: far too much on a laptop shared with Kafka and Spark.
      - --wiredTigerCacheSizeGB=0.5
      # The oplog is a fixed-size log of every write (2 GiB here), used by
      # change streams. Unlike a Postgres slot it never grows, so a stopped
      # connector cannot fill the disk; instead, once the oldest entry it
      # needs is overwritten, it must re-snapshot (spec FR13). Only applied
      # when the oplog is first created; later changes need replSetResizeOplog.
      - --oplogSize=2048
    environment:
      # Root user, created by the entrypoint on the first start only.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in onprem/.env}
    ports:
      # Host tools must add directConnection=true (see mongo/setup.js).
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      # Holds the generated keyfile; named so it survives `down`.
      - mongo-config:/data/configdb
      # The folder, not single files: a file bind mount follows the file's
      # inode, so an editor that saves by replacing the file leaves the
      # container (and Docker Desktop's mount cache) on the deleted copy.
      - ./mongo:/etc/mongo:ro
    healthcheck:
      # Healthy means "accepts writes": the replica set is initiated (by
      # mongo-init) and this node won its election. hello needs no login.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    # Lets mongod flush and close its data files on `down`.
    stop_grace_period: 30s

  mongo-init:
    # One-shot: runs mongo/setup.js (replica set, users, collections), then
    # exits 0. Runs on every `up`; the script is idempotent.
    image: mongo:8.0.32@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
    profiles: [core]
    depends_on:
      mongo:
        # Not service_healthy: mongo only becomes healthy after this runs.
        condition: service_started
    # The server may still be starting: retry for up to 60 s before failing.
    entrypoint:
      - /bin/bash
      - -c
      - for i in $$(seq 30); do mongosh --quiet --host mongo --eval 'db.hello().ok' > /dev/null 2>&1 && exec mongosh --quiet --nodb /setup/setup.js; sleep 2; done; echo "mongo not reachable"; exit 1
    environment:
      # Read by setup.js with process.env, so no password is on a command line.
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in onprem/.env}
      MONGO_GENERATOR_PASSWORD: ${MONGO_GENERATOR_PASSWORD:?set MONGO_GENERATOR_PASSWORD in onprem/.env}
      DEBEZIUM_MONGO_PASSWORD: ${DEBEZIUM_MONGO_PASSWORD:?set DEBEZIUM_MONGO_PASSWORD in onprem/.env}
      MONGO_REVIEWER_PASSWORD: ${MONGO_REVIEWER_PASSWORD:?set MONGO_REVIEWER_PASSWORD in onprem/.env}
    volumes:
      - ./mongo:/setup:ro

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: [core]
    hostname: kafka
    environment:
      # Identifies the cluster; written into the storage when it is first
      # formatted. Generated once with `kafka-storage.sh random-uuid`
      # (the image's built-in default is the same for every user).
      CLUSTER_ID: uVr1QOEmT0W6ny3s2N5dyA
      # Kafka keeps messages in the OS page cache, not the JVM heap, so a
      # small heap is enough for one broker (the start script's default is 1 GB).
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      # Only the EXTERNAL listener, localhost only.
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka/server.properties:/mnt/shared/config/server.properties:ro
    healthcheck:
      # A real Kafka request, not just an open port. Tools in this container
      # inherit KAFKA_HEAP_OPTS, so give the check its own small heap.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # Controlled shutdown: the broker closes its logs cleanly instead of
    # running log recovery on the next start.
    stop_grace_period: 60s

  schema-registry:
    # Confluent Community License (source-available, not OSI open source);
    # Apicurio Registry is the Apache 2.0 alternative (open question C4).
    image: confluentinc/cp-schema-registry:8.3.2@sha256:482d3048b3f6029bae5794b5c3b5e2eea8d61ca064dacd32241315e818fd8d7c
    profiles: [core]
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # The registry stores every schema in a compacted Kafka topic, so it
      # keeps no state of its own: the container can be recreated freely.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      # Default is 3, impossible with one broker (same trap as the
      # transaction log in kafka/server.properties).
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # A new schema version must be able to read data written with the
      # previous one, so consumers are upgraded first, then producers.
      # Allowed: adding an optional field with a default (a nullable column),
      # removing a field. Rejected: adding a required field (NOT NULL column).
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      # The image has no curl or wget; python3 is there. urlopen raises on a
      # refused connection or any HTTP error, so this is a real request.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  connect:
    # Worker image: apache/kafka 4.3.1 + Debezium Postgres + Avro converter,
    # downloads verified by SHA-256 (connect/Dockerfile).
    build: ./connect
    image: thelook-connect:local
    profiles: [core]
    hostname: connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
      # Resolved by the worker's EnvVarConfigProvider for ${env:...} placeholders
      # in connector configs (see connect/connect-distributed.properties).
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?set DEBEZIUM_DB_PASSWORD in onprem/.env}
      DEBEZIUM_MONGO_PASSWORD: ${DEBEZIUM_MONGO_PASSWORD:?set DEBEZIUM_MONGO_PASSWORD in onprem/.env}
      # Load the Prometheus JMX exporter agent into the worker's JVM: it serves
      # the Connect and Debezium MBeans as metrics on :9404 (Compose network
      # only; Prometheus scrapes it, nothing is published to the host).
      KAFKA_OPTS: -javaagent:/opt/jmx_prometheus_javaagent.jar=9404:/etc/kafka-connect/jmx-exporter.yml
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./connect/connect-distributed.properties:/etc/kafka-connect/connect-distributed.properties:ro
      - ./connect/jmx-exporter.yml:/etc/kafka-connect/jmx-exporter.yml:ro
    healthcheck:
      # The REST API only answers once the worker has joined its group.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s

  # --- stream profile (P3): Spark standalone cluster -----------------------------
  # One master and one worker, shared by the streaming bronze job and (P4)
  # the batch jobs. Each application caps its cores (spark.cores.max) and
  # brings its own AWS identity (spark/lakehouse/session.py): no AWS key
  # here.
  #   make up PROFILES="core stream"

  spark-master:
    build:
      context: ./spark
      # The Dockerfile's last stage is Airflow: name the Spark stage, or the
      # cluster would silently be built from the Airflow image.
      target: spark
    image: thelook-spark:local
    profiles: [stream]
    hostname: spark-master
    # tini as PID 1: forwards stop signals to the JVM and reaps zombies
    # (the image's entrypoint only adds tini for Kubernetes drivers/executors).
    init: true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      # Bind and advertise the name everyone connects to (spark://spark-master:7077).
      # By default the master binds its RPC port to the container's IP and
      # advertises that IP, so a check on localhost fails and the name used
      # by workers differs from the master's own address (the same family of
      # trap as Kafka's advertised.listeners).
      SPARK_MASTER_HOST: spark-master
      # An application that sets no spark.cores.max gets 1 core, not all.
      SPARK_MASTER_OPTS: -Dspark.deploy.defaultCores=1
      SPARK_DAEMON_MEMORY: 512m
    ports:
      # Master web UI: applications, workers, cores in use.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker:
    image: thelook-spark:local
    profiles: [stream]
    hostname: spark-worker
    init: true
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      # What this worker offers to applications (executors), beyond its own
      # small daemon. 4 cores / 3 GB fit a 16 GB laptop next to the core
      # profile (~4.6 GB).
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 3g
      SPARK_DAEMON_MEMORY: 512m
      # Executors import the lakehouse package (functions they run, e.g. in
      # foreachBatch, are pickled by reference to their module).
      PYTHONPATH: /opt/lakehouse
    volumes:
      - ../spark:/opt/lakehouse:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bronze-stream:
    # The streaming bronze writer (spark/jobs/bronze_stream.py, ADR 007): a
    # long-running driver in client mode; its executors run on the worker.
    image: thelook-spark:local
    profiles: [stream]
    init: true
    depends_on:
      spark-worker:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/lakehouse
      LAKE_BUCKET: ${LAKE_BUCKET:?set LAKE_BUCKET in onprem/.env}
      AWS_REGION: us-east-1
      # The bronze writer's IAM user (iam.tf), passed to its executors by
      # lakehouse.session.
      AWS_ACCESS_KEY_ID: ${SPARK_STREAM_AWS_ACCESS_KEY_ID:?set SPARK_STREAM_AWS_ACCESS_KEY_ID in onprem/.env}
      AWS_SECRET_ACCESS_KEY: ${SPARK_STREAM_AWS_SECRET_ACCESS_KEY:?set SPARK_STREAM_AWS_SECRET_ACCESS_KEY in onprem/.env}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - /opt/lakehouse/jobs/bronze_stream.py
    ports:
      # Driver UI: Structured Streaming tab (batch durations, input rates).
      - "127.0.0.1:4040:4040"
    volumes:
      - ../spark:/opt/lakehouse:ro
      # The checkpoint (Kafka offsets of each batch, query id) must outlive
      # the container: a lost checkpoint means a new query from the
      # earliest offsets (duplicates in bronze, removed in silver).
      - spark-checkpoints:/opt/checkpoints
    # Lets the current micro-batch finish its commits on `docker compose stop`.
    stop_grace_period: 60s
    # Unlike the core services (no restart policy, so failures are noticed),
    # the stream restarts itself after a crash: it resumes from its
    # checkpoint and the replay guard prevents duplicates. Short S3/Glue
    # blips are retried inside the batch; this covers the rest (driver
    # crash, retries exhausted). After 3 failed restarts it stays down,
    # visible in `make ps` (alerting: P7).
    restart: on-failure:3

  # --- jobs profile: one-off Spark drivers (make spark-run) ----------------------
  # Never started by `make up`; `docker compose run` creates a throwaway
  # driver container that submits to the cluster in client mode.
  spark-job:
    image: thelook-spark:local
    profiles: [jobs]
    init: true
    environment:
      PYTHONPATH: /opt/lakehouse
      LAKE_BUCKET: ${LAKE_BUCKET:?set LAKE_BUCKET in onprem/.env}
      AWS_REGION: us-east-1
      # One-off jobs run as the batch user (iam.tf): read bronze, write
      # silver and gold. The stream's key belongs to bronze-stream only.
      AWS_ACCESS_KEY_ID: ${SPARK_BATCH_AWS_ACCESS_KEY_ID:?set SPARK_BATCH_AWS_ACCESS_KEY_ID in onprem/.env}
      AWS_SECRET_ACCESS_KEY: ${SPARK_BATCH_AWS_SECRET_ACCESS_KEY:?set SPARK_BATCH_AWS_SECRET_ACCESS_KEY in onprem/.env}
    volumes:
      - ../spark:/opt/lakehouse:ro
    entrypoint: ["/opt/spark/bin/spark-submit", "--master", "spark://spark-master:7077"]

  # --- airflow profile (P4): scheduling of the batch jobs (ADR 013) ---------------
  #   make up PROFILES="core stream airflow"
  # Airflow runs spark-submit (client mode) against the stream profile's
  # cluster; that profile must be up too (no depends_on across profiles).

  airflow-db:
    # Airflow's own metadata database, never the source database. Same
    # pinned image as the source Postgres.
    image: postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    profiles: [airflow]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in onprem/.env}
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  airflow-init:
    # One-shot: create or upgrade Airflow's metadata schema (idempotent).
    build:
      context: ./spark
      target: airflow
    image: thelook-airflow:local
    profiles: [airflow]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in onprem/.env}@airflow-db:5432/airflow
      # Encrypts connection passwords stored in the metadata database.
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in onprem/.env}
      # Signs the tokens between the api-server and the task runners.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in onprem/.env}
      # Signs the requests the api-server makes to the scheduler's log server
      # (task logs in the UI). Unset, every component generates its own
      # random key and the UI cannot show any task log.
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in onprem/.env}
      # Airflow 3: tasks report to the api-server's execution API.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Then the pool "lake": one slot shared by every Spark task of transform
    # and maintenance, so a compaction never commits at the same time as a
    # MERGE on the same table (ADR 017). Both commands are idempotent.
    command:
      - bash
      - -c
      - airflow db migrate && airflow pools set lake 1 "Spark jobs writing silver and gold, one at a time (ADR 017)"

  airflow-apiserver:
    image: thelook-airflow:local
    profiles: [airflow]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common
      # Login with the simple auth manager: one admin user whose password
      # comes from onprem/.env (written to the passwords file at start).
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in onprem/.env}
    command:
      - bash
      - -c
      - >-
        python -c 'import json, os; json.dump({"admin": os.environ["AIRFLOW_ADMIN_PASSWORD"]},
        open("/opt/airflow/passwords.json", "w"))' && exec airflow api-server
    ports:
      # UI and API (Spark's master UI already uses 8080 on the host).
      - "127.0.0.1:8088:8080"
    volumes:
      # Task logs, shared with the scheduler that writes them: the UI reads
      # the files directly, and they survive `make down`.
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  airflow-scheduler:
    # Under LocalExecutor the scheduler also runs the tasks, i.e. the
    # spark-submit drivers: the only Airflow container with the AWS key.
    image: thelook-airflow:local
    profiles: [airflow]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common
      # spark-submit target (JSON connection: the URI form would lose the
      # spark:// scheme of the host).
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
      # The jobs' environment (as in the jobs profile): the batch user only,
      # never the stream key (ADR 013).
      PYTHONPATH: /opt/lakehouse
      LAKE_BUCKET: ${LAKE_BUCKET:?set LAKE_BUCKET in onprem/.env}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${SPARK_BATCH_AWS_ACCESS_KEY_ID:?set SPARK_BATCH_AWS_ACCESS_KEY_ID in onprem/.env}
      AWS_SECRET_ACCESS_KEY: ${SPARK_BATCH_AWS_SECRET_ACCESS_KEY:?set SPARK_BATCH_AWS_SECRET_ACCESS_KEY in onprem/.env}
      # Drivers run the system Python 3.10, like the executors, not
      # Airflow's virtualenv.
      PYSPARK_PYTHON: /usr/bin/python3
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3
    command: ["airflow", "scheduler"]
    # Bounded resources (ADR 013): the scheduler hosts the Spark drivers.
    mem_limit: 3g
    volumes:
      - ../spark:/opt/lakehouse:ro
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs

  airflow-dag-processor:
    # Airflow 3: parses DAG files in its own process (no AWS key needed).
    image: thelook-airflow:local
    profiles: [airflow]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common
    command: ["airflow", "dag-processor"]
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs

  # --- serving profile (P5): online user features (ADR 018) ----------------------
  # Redis, the features stream (step 5) and the API (step 7). Needs the core
  # profile (Kafka, Schema Registry); not the stream profile, and no AWS key.
  #   make up PROFILES="core serving"

  redis:
    image: redis:8.10.2-trixie@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    profiles: [serving]
    hostname: redis
    # Builds the ACL file from the passwords below, then starts redis-server
    # with redis.conf (persistence, memory cap) as the redis user.
    entrypoint: ["/bin/bash", "/etc/redis/start-redis.sh"]
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD in onprem/.env}
      REDIS_FEATURES_PASSWORD: ${REDIS_FEATURES_PASSWORD:?set REDIS_FEATURES_PASSWORD in onprem/.env}
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?set REDIS_API_PASSWORD in onprem/.env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # The append-only file: features survive `down` with the checkpoint.
      - redis-data:/data
      # The folder, not single files (same reason as ./mongo above).
      - ./redis:/etc/redis:ro
    # maxmemory is 256 MB; an AOF rewrite forks the process, and pages
    # written meanwhile are copied, so the limit leaves room for that.
    mem_limit: 512m
    healthcheck:
      # Logs in as the read-only api user. REDISCLI_AUTH keeps the password
      # off the command line ($$: expanded in the container, not by Compose).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_API_PASSWORD\" redis-cli --user api ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Lets Redis fsync the AOF and exit cleanly on `down`.
    stop_grace_period: 30s

  features-stream:
    # The features stream (spark/jobs/features_stream.py, ADR 018): its own
    # Spark application in local mode (driver and executor in one JVM), so
    # it takes no core from the shared worker and needs no stream profile.
    build:
      context: ./spark
      target: features
    image: thelook-spark-features:local
    profiles: [serving]
    init: true
    depends_on:
      redis:
        condition: service_healthy
      # In the core profile. required: false: waited for when that profile
      # is started too, and no error when it is not (Compose otherwise
      # rejects a dependency in an inactive profile). Without them, the first
      # batch asked Schema Registry for a schema while it was still starting.
      kafka:
        condition: service_healthy
        required: false
      schema-registry:
        condition: service_healthy
        required: false
    # local[2] uses 2 cores; the cap also makes the JVM size itself for 2
    # CPUs. Uncapped, it saw the VM's 32 and sized its GC, JIT and Spark
    # thread pools for them (454 threads, ~2.2 GB resident for a 768 MB heap).
    cpus: 2
    # Measured peak 1.4 GiB during a full rebuild from Kafka (P5 step 9),
    # 1.3 GiB steady. Above the limit the kernel kills it; the restart policy
    # and idempotent replay recover, and the laptop's other services are safe.
    mem_limit: 2g
    environment:
      # glibc keeps up to 8 malloc arenas per CPU, each holding memory once
      # touched; 2 is the usual setting for a JVM in a container.
      MALLOC_ARENA_MAX: 2
      PYTHONPATH: /opt/lakehouse
      REDIS_HOST: redis
      REDIS_FEATURES_PASSWORD: ${REDIS_FEATURES_PASSWORD:?set REDIS_FEATURES_PASSWORD in onprem/.env}
      # No AWS variables: this job reads Kafka and writes Redis, nothing else.
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      # Local mode: the driver JVM is also the executor, so this is the
      # job's whole heap.
      - --driver-memory
      - 768m
      - /opt/lakehouse/jobs/features_stream.py
    ports:
      # Driver UI (4040 on the host is the bronze stream's).
      - "127.0.0.1:4041:4040"
    volumes:
      - ../spark:/opt/lakehouse:ro
      # Its own checkpoint volume: a rebuild of the features (runbook) is
      # "remove this volume, flush user:*", without touching bronze's.
      - features-checkpoints:/opt/checkpoints
    stop_grace_period: 30s
    # Like the bronze stream: restarts after a crash (Redis down longer than
    # the client's retries, Kafka unreachable) and resumes from its
    # checkpoint; idempotent writes make the replayed batch harmless. Not
    # capped at 3 tries: a long Redis outage must not leave it down.
    restart: on-failure

  api:
    # The serving API (api/app.py, ADR 018): GET /users/{id}/features from
    # Redis, as the read-only api ACL user. OpenAPI docs at /docs.
    build: ../api
    image: thelook-api:local
    profiles: [serving]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?set REDIS_API_PASSWORD in onprem/.env}
    # While Redis is stopped its name leaves Docker's DNS, which forwards the
    # lookup to the host's resolver: 8 s before "Name or service not known"
    # (measured). Names of running containers are answered locally at once,
    # so 1 s and one attempt only cut that wait (a 503 in ~1 s, not ~9 s).
    dns_opt:
      - timeout:1
      - attempts:1
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /health answers 200 only when the API reaches Redis. The slim image
      # has no curl: Python's urllib raises on a non-2xx status.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # --- monitoring profile ------------------------------------------------------
  # Start with the core stack:
  #   docker compose --profile core --profile monitoring up -d
  # No depends_on on core services: a dependency in an inactive profile is an
  # error, and the exporter reports pg_up=0 until Postgres is reachable.

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    environment:
      # Connects as the pg_monitor-only role (postgres/monitoring-setup.sql).
      DATA_SOURCE_URI: postgres:5432/thelook?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD:?set EXPORTER_DB_PASSWORD in onprem/.env}

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [monitoring]
    depends_on: [alertmanager]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A week of history is enough to look back at a drill.
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [monitoring]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  pgdata:
  airflow-db:
  # The volume is created from the image's /opt/airflow/logs (owned by the
  # spark user), so Airflow can write to it.
  airflow-logs:
  spark-checkpoints:
  mongo-data:
  mongo-config:
  kafka-data:
  prometheus-data:
  redis-data:
  features-checkpoints:
