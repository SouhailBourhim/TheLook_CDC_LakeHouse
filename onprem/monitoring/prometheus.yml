# Prometheus: scrapes metrics every 15 s, evaluates alert rules, and sends
# firing alerts to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # postgres_exporter turns SQL queries on pg_replication_slots, pg_stat_*
  # into metrics. The job name is used by the PostgresExporterDown alert.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # JMX exporter agent inside the Kafka Connect worker (Connect + Debezium
  # MBeans). Used by the connect alert group.
  - job_name: connect
    static_configs:
      - targets: ["connect:9404"]

  # mongodb_exporter (compatible mode): replica set and oplog metrics,
  # used by the mongodb alert group (oplog window).
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
