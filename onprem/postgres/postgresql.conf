# Postgres configuration for the source database.
#
# This file replaces the image's generated postgresql.conf (compose passes
# -c config_file=...). Anything not set here uses Postgres' built-in default.
# Settings changed with ALTER SYSTEM (postgresql.auto.conf) override this
# file after pg_reload_conf(), which is what the slot runbook relies on.
# Do not move these settings back to -c flags: command-line flags override
# ALTER SYSTEM, so incident changes would silently do nothing.

# Restated from the image's generated file.
listen_addresses = '*'
timezone = 'UTC'
log_timezone = 'UTC'

# Write enough detail to the WAL to decode it into row changes (pgoutput).
# Restart required.
wal_level = logical

# One slot and one sender for Debezium, plus headroom for a reconnect
# overlap and the drills. Low on purpose: a leaked slot shows up fast.
# Restart required.
max_replication_slots = 4
max_wal_senders = 4

# Cap the WAL a slot may retain. Past this, Postgres invalidates the slot
# instead of filling the disk, and the connector needs a re-snapshot.
# WAL rate at 5 generator iterations/s: ~106 MB/hour on nearly empty tables
# (commit 6), 547 MB/hour in the slot drill with ~70k orders (full-page
# images after each checkpoint grow with table size; docs/results.md).
# So 10GB holds ~18 hours of consumer downtime at 5/s; the one-hour drill
# used 547 MB. Re-checked in the baseline run (commit 15).
# Reload is enough to change it.
max_slot_wal_keep_size = 10GB

# Compress full-page images in the WAL (they follow every checkpoint and
# were most of the WAL bytes). Measured at 5 iterations/s: 623 -> 502 MB/hour
# (-19 %), CPU cost not visible at these rates (docs/results.md).
# lz4 is built into the image's Postgres 17. Reload is enough.
wal_compression = lz4
