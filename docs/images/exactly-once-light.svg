<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Exactly once into bronze: a replayed batch skips the tables already marked with it; the ledger row comes last" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Exactly once into bronze: a replayed batch skips the tables already marked with it; the ledger row comes last</title>
<rect width="1000" height="250" rx="8" fill="#fcfcfb"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect x="16" y="74" width="150" height="64" rx="32.0" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/>
<text x="91.0" y="103.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">batch N</text>
<text x="91.0" y="120.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">offsets from</text>
<text x="91.0" y="134.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">the checkpoint</text>
<rect x="196" y="64" width="220" height="84" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="306.0" y="103.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Already written?</text>
<text x="306.0" y="120.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">a commit on the table marked</text>
<text x="306.0" y="134.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">with this query and batch N</text>
<rect x="456" y="30" width="190" height="58" rx="10" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/>
<text x="551.0" y="56.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">skip the table</text>
<text x="551.0" y="73.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">logged skipped(replay)</text>
<rect x="456" y="124" width="190" height="58" rx="10" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/>
<text x="551.0" y="150.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">append the rows</text>
<text x="551.0" y="167.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">commit marked: query, batch N</text>
<rect x="686" y="74" width="150" height="64" rx="10" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/>
<text x="761.0" y="103.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">ledger row, last</text>
<text x="761.0" y="120.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">every table's</text>
<text x="761.0" y="134.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">snapshot id</text>
<rect x="866" y="74" width="118" height="64" rx="32.0" fill="#fcfcfb" stroke="#dcdbd5" stroke-width="1"/>
<text x="925.0" y="103.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">offsets</text>
<text x="925.0" y="120.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">committed</text>
<polyline points="166.0,106.0 196.0,106.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<polyline points="416.0,92.0 436.0,92.0 436.0,59.0 456.0,59.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="426.0" y="52.0" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="end">yes</text>
<polyline points="416.0,120.0 436.0,120.0 436.0,153.0 456.0,153.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="430.0" y="170.0" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="end">no</text>
<polyline points="646.0,59.0 666.0,59.0 666.0,98.0 686.0,98.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<polyline points="646.0,153.0 666.0,153.0 666.0,114.0 686.0,114.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<polyline points="836.0,106.0 866.0,106.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#head)"/>
<polyline points="925.0,138.0 925.0,220.0 91.0,220.0 91.0,140.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#head)"/>
<text x="503.0" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">crash anywhere: the restart runs batch N again, and every table already written is skipped</text>
</svg>
