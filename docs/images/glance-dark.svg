<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Measured: Database commit to Kafka &lt; 1 s (Debezium on the WAL and change streams); Commit to queryable bronze 75 s (median, max 88 s · target 5 min); Commit to gold 10–36 min (bounded by the 30-min schedule · target 1 h); Commit to the features API 9.6 s (median, max 10.6 s · target 1 min); GDPR erasure, every store 1 h 45 min (sources, lake, Redis, time travel · target 24 h); Failure drills 0 lost (160,884 records reconciled, 0 appended twice)" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
