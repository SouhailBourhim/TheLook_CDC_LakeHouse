<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Bad rows counted by the revenue contract during the backfill drill" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Bad rows counted by the revenue contract during the backfill drill</title>
<rect width="760" height="330" rx="8" fill="#fcfcfb"/>
<text x="24.0" y="32.0" fill="#0b0b0b" font-size="16" font-weight="600" text-anchor="start">A backfill's quality check sees the whole table</text>
<text x="24.0" y="52.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Bad rows the revenue contract counted after each day was rebuilt (P8 step 9). Days run oldest first.</text>
<line x1="48.0" y1="278.0" x2="470.0" y2="278.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="40.0" y="282.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end">0</text>
<line x1="48.0" y1="218.7" x2="470.0" y2="218.7" stroke="#e1e0d9" stroke-width="1"/>
<text x="40.0" y="222.7" fill="#898781" font-size="11" font-weight="400" text-anchor="end">1</text>
<line x1="48.0" y1="159.3" x2="470.0" y2="159.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="40.0" y="163.3" fill="#898781" font-size="11" font-weight="400" text-anchor="end">2</text>
<line x1="48.0" y1="100.0" x2="470.0" y2="100.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="40.0" y="104.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end">3</text>
<text x="88.0" y="296.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">Oct 5</text>
<text x="259.0" y="296.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">Oct 6</text>
<text x="430.0" y="296.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">Oct 7</text>
<line x1="48.0" y1="70.0" x2="66.0" y2="70.0" stroke="#2a78d6" stroke-width="2"/>
<text x="72.0" y="74.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Bug backfilled</text>
<line x1="178.0" y1="70.0" x2="196.0" y2="70.0" stroke="#eb6834" stroke-width="2"/>
<text x="202.0" y="74.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Fix backfilled</text>
<polyline points="88.0,218.7 259.0,159.3 430.0,100.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="88.0" cy="218.7" r="5" fill="#fcfcfb"/><circle cx="88.0" cy="218.7" r="4" fill="#2a78d6"/>
<circle cx="259.0" cy="159.3" r="5" fill="#fcfcfb"/><circle cx="259.0" cy="159.3" r="4" fill="#2a78d6"/>
<circle cx="430.0" cy="100.0" r="5" fill="#fcfcfb"/><circle cx="430.0" cy="100.0" r="4" fill="#2a78d6"/>
<polyline points="88.0,159.3 259.0,218.7 430.0,278.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="88.0" cy="159.3" r="5" fill="#fcfcfb"/><circle cx="88.0" cy="159.3" r="4" fill="#eb6834"/>
<circle cx="259.0" cy="218.7" r="5" fill="#fcfcfb"/><circle cx="259.0" cy="218.7" r="4" fill="#eb6834"/>
<circle cx="430.0" cy="278.0" r="5" fill="#fcfcfb"/><circle cx="430.0" cy="278.0" r="4" fill="#eb6834"/>
<text x="100.0" y="234.7" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">1: its own row</text>
<text x="100.0" y="249.7" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">= caught</text>
<text x="442.0" y="268.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">0 = repaired</text>
<text x="510.0" y="118.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">Each check counts every day</text>
<text x="510.0" y="136.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">still holding a bad row.</text>
<text x="510.0" y="154.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start"></text>
<text x="510.0" y="172.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">The first buggy day's 1 is</text>
<text x="510.0" y="190.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">its own row: the baseline</text>
<text x="510.0" y="208.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">was clean. Only the last</text>
<text x="510.0" y="226.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">fixed day sees every day</text>
<text x="510.0" y="244.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">rewritten: the repair.</text>
</svg>
