# Continuous integration (spec FR18). Runs on every push and pull request:
# lint, unit tests (components and PySpark), alert-rule tests. Grows with
# each phase (terraform fmt/validate and OIDC in P9).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (the tag in the comment is for humans):
# a tag can be moved to other code, a SHA cannot. Same idea as pinning
# images by digest.

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      # Rules and exclusions live in ruff.toml; the version is pinned so a new
      # ruff release cannot change the result.
      - run: uvx ruff@0.16.10 check --output-format github .
      - run: uvx ruff@0.16.10 format --check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Each component has its own dependencies (its requirements.txt), as in
      # its Docker image, so each is tested in its own environment.
      matrix:
        component: [onprem/generator, onprem/review-simulator]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      # --no-project: these folders are not packages; uv builds a throwaway
      # environment with the component's requirements plus pytest.
      - run: >
          uv run --no-project --python 3.12
          --with-requirements requirements.txt --with pytest==9.1.1
          python -m pytest -q

  spark:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Spark image's versions (ADR 011): Java 17, Python 3.10, pyspark
      # 4.1.3. A different Python minor would test other behaviour than
      # production runs.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      # conftest.py downloads spark-avro and the Iceberg runtime (47 MB) and
      # checks their SHA-256; the cache avoids downloading them every push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/thelook-jars
          key: thelook-jars-${{ hashFiles('spark/tests/conftest.py') }}
      - run: >
          uv run --no-project --python 3.10
          --with-requirements requirements-test.txt
          python -m pytest -q

  dags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      # Airflow installed exactly as in the image (ADR 013): Python 3.10, the
      # checksummed 3.3.2 constraints minus our overridden pins, the override.
      - run: airflow/ci-constraints.sh /tmp/constraints.txt
      - run: >
          uv venv --python 3.10 /tmp/af &&
          uv pip install --python /tmp/af -r airflow/requirements-test.txt
          -c /tmp/constraints.txt --override onprem/spark/airflow-overrides.txt
      - run: /tmp/af/bin/python -m pytest -q airflow/tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  alert-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Prometheus image the stack uses, so promtool matches the server.
      - run: >
          docker run --rm -v "$PWD/onprem/monitoring:/m:ro" -w /m
          --entrypoint promtool
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          test rules alerts_test.yml
