# ODCS data contract (ADR 020). Drafted from the Glue catalog with
# `datacontract import glue`, then curated. Source of truth for this table.
apiVersion: v3.2.0
kind: DataContract
id: thelook-silver-users
name: silver.users
version: 1.0.0
status: active
domain: thelook
description:
  purpose: Current state of each user (PostgreSQL shop.users)
  limitations: Synthetic data (theLook generator); see docs/source-schema.md
team:
- username: souhail
  role: owner
servers:
- server: athena
  type: athena
  catalog: awsdatacatalog
  schema: thelook_silver
  regionName: us-east-1
  workgroup: thelook
schema:
- name: users
  physicalName: users
  physicalType: table
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 0
  - type: sql
    description: ages are plausible
    query: SELECT count(*) FROM users WHERE age < 0 OR age > 120
    mustBe: 0
  properties:
  - name: id
    physicalType: string
    logicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    unique: true
  - name: first_name
    physicalType: string
    logicalType: string
    required: true
    classification: pii
  - name: last_name
    physicalType: string
    logicalType: string
    required: true
    classification: pii
  - name: email
    physicalType: string
    logicalType: string
    required: true
    classification: pii
  - name: age
    physicalType: int
    logicalType: integer
  - name: gender
    physicalType: string
    logicalType: string
  - name: street_address
    physicalType: string
    logicalType: string
    classification: pii
  - name: postal_code
    physicalType: string
    logicalType: string
    classification: pii
  - name: city
    physicalType: string
    logicalType: string
  - name: state
    physicalType: string
    logicalType: string
  - name: country
    physicalType: string
    logicalType: string
  - name: latitude
    physicalType: double
    logicalType: number
    classification: pii
  - name: longitude
    physicalType: double
    logicalType: number
    classification: pii
  - name: traffic_source
    physicalType: string
    logicalType: string
  - name: created_at
    physicalType: timestamp
    logicalType: timestamp
    required: true
  - name: updated_at
    physicalType: timestamp
    logicalType: timestamp
  - name: _position
    physicalType: bigint
    logicalType: integer
  - name: _source_ts
    physicalType: timestamp
    logicalType: timestamp
  - name: _row_hash
    physicalType: string
    logicalType: string
  - name: _merged_at
    physicalType: timestamp
    logicalType: timestamp
