# ODCS data contract (ADR 020). Drafted from the Glue catalog with
# `datacontract import glue`, then curated. Source of truth for this table.
apiVersion: v3.2.0
kind: DataContract
id: thelook-silver-order_items
name: silver.order_items
version: 1.0.0
status: active
domain: thelook
description:
  purpose: Current state of each order item (PostgreSQL shop.order_items)
  limitations: Synthetic data (theLook generator); see docs/source-schema.md
team:
- username: souhail
  role: owner
servers:
- server: athena
  type: athena
  catalog: awsdatacatalog
  schema: thelook_silver
  regionName: us-east-1
  workgroup: thelook
schema:
- name: order_items
  physicalName: order_items
  physicalType: table
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 0
  - type: sql
    description: quantities are positive
    query: SELECT count(*) FROM order_items WHERE quantity < 1
    mustBe: 0
  - type: sql
    description: prices are not negative
    query: SELECT count(*) FROM order_items WHERE sale_price < 0
    mustBe: 0
  properties:
  - name: id
    physicalType: string
    logicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    unique: true
  - name: order_id
    physicalType: string
    logicalType: string
    required: true
  - name: product_id
    physicalType: bigint
    logicalType: integer
    required: true
  - name: status
    physicalType: string
    logicalType: string
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - Processing
        - Shipped
        - Delivered
        - Cancelled
        - Returned
      mustBe: 0
  - name: quantity
    physicalType: int
    logicalType: integer
    required: true
  - name: sale_price
    physicalType: decimal
    customProperties:
    - property: precision
      value: 10
    - property: scale
      value: 2
    logicalType: number
    required: true
  - name: created_at
    physicalType: timestamp
    logicalType: timestamp
    required: true
  - name: updated_at
    physicalType: timestamp
    logicalType: timestamp
  - name: shipped_at
    physicalType: timestamp
    logicalType: timestamp
  - name: delivered_at
    physicalType: timestamp
    logicalType: timestamp
  - name: returned_at
    physicalType: timestamp
    logicalType: timestamp
  - name: cancelled_at
    physicalType: timestamp
    logicalType: timestamp
  - name: _position
    physicalType: bigint
    logicalType: integer
  - name: _source_ts
    physicalType: timestamp
    logicalType: timestamp
  - name: _row_hash
    physicalType: string
    logicalType: string
  - name: _merged_at
    physicalType: timestamp
    logicalType: timestamp
