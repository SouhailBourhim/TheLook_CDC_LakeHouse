# ODCS data contract (ADR 020). Drafted from the Glue catalog with
# `datacontract import glue`, then curated. Source of truth for this table.
apiVersion: v3.2.0
kind: DataContract
id: thelook-silver-reviews
name: silver.reviews
version: 1.0.0
status: active
domain: thelook
description:
  purpose: Product reviews parsed from MongoDB web.reviews (deleted reviews removed)
  limitations: Synthetic data (theLook generator); see docs/source-schema.md
team:
- username: souhail
  role: owner
servers:
- server: athena
  type: athena
  catalog: AwsDataCatalog
  schema: thelook_silver
  regionName: us-east-1
  workgroup: thelook
schema:
- name: reviews
  physicalName: reviews
  physicalType: table
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 0
  - type: sql
    description: ratings are 1 to 5
    query: SELECT count(*) FROM reviews WHERE rating NOT BETWEEN 1 AND 5
    mustBe: 0
  properties:
  - name: id
    physicalType: string
    logicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    unique: true
  - name: order_item_id
    physicalType: string
    logicalType: string
    required: true
  - name: product_id
    physicalType: bigint
    logicalType: integer
    required: true
  - name: user_id
    physicalType: string
    logicalType: string
    required: true
  - name: rating
    physicalType: int
    logicalType: integer
    required: true
  - name: title
    physicalType: string
    logicalType: string
  - name: text
    physicalType: string
    logicalType: string
  - name: tags
    physicalType: array<string>
    logicalType: array
    items:
      name: items
      physicalType: string
      logicalType: string
  - name: helpful_votes
    physicalType: int
    logicalType: integer
  - name: created_at
    physicalType: timestamp
    logicalType: timestamp
    required: true
  - name: updated_at
    physicalType: timestamp
    logicalType: timestamp
  - name: edited_at
    physicalType: timestamp
    logicalType: timestamp
  - name: _position
    physicalType: bigint
    logicalType: integer
  - name: _source_ts
    physicalType: timestamp
    logicalType: timestamp
  - name: _row_hash
    physicalType: string
    logicalType: string
  - name: _merged_at
    physicalType: timestamp
    logicalType: timestamp
