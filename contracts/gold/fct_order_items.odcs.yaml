# ODCS data contract (ADR 020). Drafted from the Glue catalog with
# `datacontract import glue`, then curated. Source of truth for this table.
apiVersion: v3.2.0
kind: DataContract
id: thelook-gold-fct_order_items
name: gold.fct_order_items
version: 1.0.0
status: active
domain: thelook
description:
  purpose: 'One row per order item (grain: order_item_id)'
  limitations: Synthetic data (theLook generator); see docs/source-schema.md
team:
- username: souhail
  role: owner
servers:
- server: athena
  type: athena
  catalog: AwsDataCatalog
  schema: thelook_gold
  regionName: us-east-1
  workgroup: thelook
schema:
- name: fct_order_items
  physicalName: fct_order_items
  physicalType: table
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 0
  - type: sql
    description: no item left on the unknown member for over an hour
    query: SELECT count(*) FROM fct_order_items WHERE user_sk = -1 AND _computed_at < current_timestamp
      - INTERVAL '1' HOUR
    mustBe: 0
  - type: sql
    description: every product exists in dim_product
    query: SELECT count(*) FROM fct_order_items f LEFT JOIN dim_product p ON f.product_id = p.product_id
      WHERE p.product_id IS NULL
    mustBe: 0
  - type: sql
    description: every user key exists in dim_user
    query: SELECT count(*) FROM fct_order_items f LEFT JOIN dim_user u ON f.user_sk = u.user_sk WHERE
      u.user_sk IS NULL
    mustBe: 0
  - type: sql
    description: gross amount is price times quantity
    query: SELECT count(*) FROM fct_order_items WHERE gross_amount <> sale_price * quantity
    mustBe: 0
  properties:
  - name: order_item_id
    physicalType: string
    logicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    unique: true
  - name: order_id
    physicalType: string
    logicalType: string
    required: true
  - name: user_id
    physicalType: string
    logicalType: string
  - name: user_sk
    physicalType: bigint
    logicalType: integer
    required: true
  - name: product_id
    physicalType: bigint
    logicalType: integer
    required: true
  - name: distribution_center_id
    physicalType: bigint
    logicalType: integer
  - name: order_date_key
    physicalType: int
    logicalType: integer
    required: true
  - name: status
    physicalType: string
    logicalType: string
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - Processing
        - Shipped
        - Delivered
        - Cancelled
        - Returned
      mustBe: 0
  - name: quantity
    physicalType: int
    logicalType: integer
  - name: sale_price
    physicalType: decimal
    customProperties:
    - property: precision
      value: 10
    - property: scale
      value: 2
    logicalType: number
  - name: unit_cost
    physicalType: decimal
    customProperties:
    - property: precision
      value: 10
    - property: scale
      value: 2
    logicalType: number
  - name: gross_amount
    physicalType: decimal
    customProperties:
    - property: precision
      value: 12
    - property: scale
      value: 2
    logicalType: number
    required: true
  - name: cost_amount
    physicalType: decimal
    customProperties:
    - property: precision
      value: 12
    - property: scale
      value: 2
    logicalType: number
  - name: is_cancelled
    physicalType: boolean
    logicalType: boolean
  - name: is_returned
    physicalType: boolean
    logicalType: boolean
  - name: created_at
    physicalType: timestamp
    logicalType: timestamp
  - name: shipped_at
    physicalType: timestamp
    logicalType: timestamp
  - name: delivered_at
    physicalType: timestamp
    logicalType: timestamp
  - name: returned_at
    physicalType: timestamp
    logicalType: timestamp
  - name: cancelled_at
    physicalType: timestamp
    logicalType: timestamp
  - name: hours_to_ship
    physicalType: double
    logicalType: number
  - name: hours_to_deliver
    physicalType: double
    logicalType: number
  - name: _computed_at
    physicalType: timestamp
    logicalType: timestamp
